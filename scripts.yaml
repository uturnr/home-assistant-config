aurora_cool_fan_light:
  alias: Aurora Cool - Fan light
  mode: restart
  sequence:
  - repeat:
      while:
      - condition: template
        value_template: '{{ is_state(''input_boolean.aurora_toggle_fan_light'', ''on'')
          }}'
      sequence:
      - target:
          entity_id: light.fan_light
        data:
          rgb_color:
          - 10
          - 120
          - 255
          transition: 3
        action: light.turn_on
      - delay: 3
      - target:
          entity_id: light.fan_light
        data:
          rgb_color:
          - 0
          - 200
          - 180
          transition: 3
        action: light.turn_on
      - delay: 3
      - target:
          entity_id: light.fan_light
        data:
          rgb_color:
          - 80
          - 0
          - 180
          transition: 3
        action: light.turn_on
      - delay: 3
  description: ''
reload_jinja_templates:
  sequence:
  - action: homeassistant.reload_custom_templates
    metadata: {}
    data: {}
  alias: Reload jinja templates
  description: ''
