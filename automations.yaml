- id: '1690041011233'
  alias: Water sensor climate or battery issue
  description: ''
  trigger:
  - type: temperature
    platform: device
    device_id: 8b9182b8e4ca65a5d3bcc8d279755042
    entity_id: f8a3498aaf5c9d84ba2db11e12f4c49d
    domain: sensor
    above: 29
  - type: humidity
    platform: device
    device_id: 8b9182b8e4ca65a5d3bcc8d279755042
    entity_id: f70120998ed72d83cc37c10e42ddfd37
    domain: sensor
    above: 70
  - type: bat_low
    platform: device
    device_id: 8b9182b8e4ca65a5d3bcc8d279755042
    entity_id: 4da69072775b18302b2354998b404313
    domain: binary_sensor
  - type: bat_low
    platform: device
    device_id: 8b9182b8e4ca65a5d3bcc8d279755042
    entity_id: 8f074e8abfdabfc65cb2c3c30984a9f9
    domain: binary_sensor
  condition: []
  action:
  - service: notify.mobile_app_cphone
    data:
      message: Check water sensor status
  mode: single
- id: '1700483246895'
  alias: Shower Heater Time Limit
  description: ''
  trigger:
  - platform: device
    type: turned_on
    device_id: 0151f06082e738f3403a58accb993be0
    entity_id: db668768eb7614d2185ad54eba401b12
    domain: switch
  condition: []
  action:
  - delay:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.shower_heater
  mode: single
- id: '1764090732452'
  alias: SmartSensor changing quickly -> Notify
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.garage_derivative
    above: 5
  - trigger: numeric_state
    entity_id:
    - sensor.garage_sensor_temperature
    below: -10
  - trigger: numeric_state
    entity_id:
    - sensor.garage_sensor_temperature
    above: 10
  conditions: []
  actions:
  - action: notify.mobile_app_cphone
    metadata: {}
    data:
      message: Garage temperature {{ states('sensor.garage_sensor_temperature') |
        round }}°C, trend {{ states('sensor.garage_derivative') }}ºC/h
  mode: single
