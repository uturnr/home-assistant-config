- id: '1666010193820'
  alias: Bedroom AC changes from off ➡️ Turn off Porch Heater
  description: ''
  trigger:
  - platform: state
    entity_id:
    - climate.bedroom_ac
    from: 'off'
  condition: []
  action:
  - service: switch.turn_off
    data: {}
    target:
      entity_id: switch.porch_heater
  mode: single
- id: set_lzw45_pixel_effect
  alias: Input Select Change ➡️ Set LZW45 Pixel Effect
  description: ''
  triggers:
  - entity_id: input_select.laundry_strip_pixel_effect
    trigger: state
  actions:
  - data:
      lzw45: light.laundry_room_light_strip
      effect: '{{ states(''input_select.laundry_strip_pixel_effect'') }}'
    action: script.lzw45_pixel_effect
- id: set_desk_lzw45_pixel_effect
  alias: Input Select Change ➡️ Set Desk LZW45 Pixel Effect
  description: ''
  triggers:
  - entity_id: input_select.desk_strip_pixel_effect
    trigger: state
  actions:
  - data:
      lzw45: light.desk_light_strip
      effect: '{{ states(''input_select.desk_strip_pixel_effect'') }}'
    action: script.lzw45_pixel_effect
- id: toggle_living_room
  alias: Press living room switch ➡️ Toggle Living Room Lights
  description: ''
  triggers:
  - event_type: zwave_js_value_notification
    event_data:
      node_id: 9
      label: Up Paddle
      value: KeyPressed
    trigger: event
  actions:
  - entity_id: light.living_room_lights
    action: light.toggle
- id: alarm_notification
  alias: Notify me when intrusion detected.
  trigger:
    platform: state
    entity_id: binary_sensor.thermostat_occupancy
    to: 'on'
  condition:
  - condition: state
    entity_id: person.me
    state: away
  action:
  - service: notify.mobile_app_cphone
    data:
      title: Motion Detected
      message: Motion Detected at Home.
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
- id: '1690039664567'
  alias: Water leak detected
  description: ''
