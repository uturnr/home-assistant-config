- id: '1778507846823'
  alias: When step vibrates ➡️ Flash couch light
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.step_vibration_vibration
    to:
    - 'on'
  conditions: []
  actions:
  - target:
      entity_id: light.couch_light
    action: light.toggle
  - if:
    - condition: state
      entity_id: input_boolean.notify_of_step
      state:
      - 'on'
    then:
    - action: script.send_critical_notification
      metadata: {}
      data:
        message: Step vibrated.
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - target:
      entity_id: light.couch_light
    action: light.toggle
  mode: single
- id: '1789227815277'
  alias: Leave home ➡️ Start vacuum
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.me
    from:
    - home
    to:
    - not_home
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: template
    value_template: '{{ (now() - (this.attributes.last_triggered | default(as_datetime(0),
      true))).total_seconds() > 86400 }}'
  - condition: state
    entity_id: binary_sensor.anyone_home
    state: 'off'
  actions:
  - action: vacuum.start
    metadata: {}
    data: {}
    target:
      entity_id: vacuum.laundry_room_messi_matter
  mode: single
- id: '1791341999203'
  alias: Main Lights off ➡️ Yard Lights off
  description: ''
  triggers:
  - trigger: light.turned_off
    target:
      entity_id: light.main_lights
    options:
      behavior: each
      for: 00:00:00
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.yard_lights
    data: {}
  mode: single
- id: '1792599527866'
  alias: 11pm nobody home ➡️ Yard Lights off
  description: ''
  triggers:
  - trigger: time
    at: '23:00:00'
  conditions:
  - condition: zone.not_in_zone
    target:
      entity_id: person.me
    options:
      behavior: any
      for: 00:00:00
      zone: zone.home
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.yard_lights
    data: {}
  mode: single
- id: '1794169637727'
  alias: Main lights on when sun down ➡️ Turn on yard lights
  description: ''
  triggers:
  - trigger: light.turned_on
    target:
      entity_id: light.main_lights
    options:
      behavior: each
